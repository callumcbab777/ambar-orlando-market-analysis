# Checks the 'Residences · The week ahead' engine (Python + JS parity) and keeps its reference outputs in sync.
# The page itself computes the residence cards live in the browser from data/comps.json.
# On every push to main that changes data/comps.json (or the engine/assumptions), it runs the
# tests, regenerates data/week_ahead.json + .js + data/week_ahead_nights.json and commits them if they changed.
# On pull requests it only runs the tests and checks the generated files are up to date.
name: week-ahead
on:
  push:
    branches: [main]
    paths:
      - "data/comps.json"
      - "data/week_ahead/**"
      - "week_ahead/**"
      - "update_week_ahead.py"
      - "assets/js/week-ahead-engine.js"
  pull_request:
    paths:
      - "data/**"
      - "week_ahead/**"
      - "update_week_ahead.py"
      - "tests/**"
      - "assets/js/week-ahead-engine.js"
      - "assets/js/week-ahead.js"
      - "assets/css/week-ahead.css"
      - "index.html"
      - "events/**"
      - "assets/js/**"
      - "assistant-proxy/**"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: week-ahead-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Tests
        run: python3 -m unittest discover -s tests -t . -v
      - name: Check generated data (pull requests)
        if: github.event_name == 'pull_request'
        run: python3 update_week_ahead.py --check
      - name: Regenerate and commit (main)
        if: github.event_name != 'pull_request'
        run: |
          python3 update_week_ahead.py
          if git diff --quiet -- data/week_ahead.json data/week_ahead.js data/week_ahead_nights.json; then
            echo "Week-ahead data already up to date."; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/week_ahead.json data/week_ahead.js data/week_ahead_nights.json
          git commit -m "Regenerate week-ahead estimates from comparable rates"
          git push
